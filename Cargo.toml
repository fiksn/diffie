[package]
name = "diffie"
version = "0.0.2"
edition = "2021"

[[bin]]
name = "dscan"
path = "src/bin/dscan.rs"

[[bin]]
name = "dshow"
path = "src/bin/dshow.rs"

[dependencies]
bincode = "1.3.3"
jiff = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
notify = "6.1"
num_cpus = "1.16"
ratatui = "0.29.0"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10"
walkdir = "2.5.0"
xattr = "1.3"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"
libc = "0.2"
