[package]
name = "diffie"
version = "0.0.2"
edition = "2021"

[[bin]]
name = "dscan"
path = "src/bin/dscan.rs"

[[bin]]
name = "faclaudit"
path = "src/bin/faclaudit.rs"

[[bin]]
name = "dshow"
path = "src/bin/dshow.rs"

[[bin]]
name = "dwatch"
path = "src/bin/dwatch.rs"

[dependencies]
ctrlc = "3.5.2"
bincode = "1.3.3"
glob = "0.3"
memmap2 = "0.9.10"
jiff = "0.2.23"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
notify = "8.2"
num_cpus = "1.17"
ratatui = "0.30.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
md-5 = "0.11.0"
blake3 = "1.8"
walkdir = "2.5.0"
xattr = "1.6"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"
exacl = "0.12.0"
nix = { version = "0.31", features = ["fanotify", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11.1"
libc = "0.2.184"
